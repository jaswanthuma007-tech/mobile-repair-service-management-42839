<svg width="1200" height="860" viewBox="0 0 1200 860" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Technicians repairing a smartphone</title>
  <defs>
    <linearGradient id="bg1" x1="161" y1="62" x2="1065" y2="770" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#0F172A" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#111827" stop-opacity="0.90"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#111827" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background blob -->
  <path d="M220 220C300 70 580 0 785 120C990 240 1090 520 930 640C770 760 410 820 230 650C50 480 140 370 220 220Z" fill="url(#bg1)"/>

  <!-- Workbench -->
  <g filter="url(#softShadow)">
    <rect x="140" y="560" width="820" height="170" rx="44" fill="#F3F4F6" stroke="#E5E7EB"/>
    <rect x="175" y="590" width="350" height="110" rx="32" fill="#FFFFFF" stroke="#E5E7EB"/>
    <rect x="545" y="590" width="380" height="110" rx="32" fill="#FFFFFF" stroke="#E5E7EB"/>
  </g>

  <!-- Smartphone -->
  <g filter="url(#softShadow)">
    <rect x="650" y="160" width="300" height="520" rx="60" fill="url(#phone)"/>
    <rect x="680" y="210" width="240" height="380" rx="42" fill="#0B1220" stroke="#1F2937"/>
    <rect x="705" y="240" width="190" height="140" rx="28" fill="#111827" stroke="#334155"/>
    <rect x="705" y="405" width="190" height="165" rx="28" fill="#0F172A" stroke="#334155"/>
    <circle cx="800" cy="195" r="9" fill="#111827" opacity="0.8"/>
  </g>

  <!-- Motherboard module -->
  <g filter="url(#softShadow)">
    <rect x="230" y="210" width="300" height="230" rx="40" fill="#0F172A" stroke="#1F2937"/>
    <rect x="260" y="245" width="110" height="85" rx="22" fill="#111827" stroke="#334155"/>
    <rect x="390" y="245" width="110" height="85" rx="22" fill="#111827" stroke="#334155"/>
    <rect x="260" y="350" width="240" height="55" rx="18" fill="#111827" stroke="#334155"/>
    <circle cx="300" cy="290" r="11" fill="#2563EB"/>
    <circle cx="455" cy="290" r="11" fill="#F59E0B"/>
    <path d="M290 430H470" stroke="#2563EB" stroke-opacity="0.35" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- Tools -->
  <g filter="url(#softShadow)">
    <rect x="205" y="610" width="150" height="26" rx="13" fill="#2563EB" opacity="0.9"/>
    <rect x="370" y="610" width="175" height="26" rx="13" fill="#F59E0B" opacity="0.85"/>
    <rect x="585" y="645" width="290" height="26" rx="13" fill="#111827" opacity="0.10"/>
    <rect x="895" y="645" width="120" height="26" rx="13" fill="#111827" opacity="0.10"/>
  </g>

  <!-- Technician silhouettes -->
  <g opacity="0.14">
    <circle cx="1010" cy="290" r="42" fill="#111827"/>
    <rect x="950" y="335" width="160" height="220" rx="52" fill="#111827"/>
  </g>
  <g opacity="0.12">
    <circle cx="165" cy="300" r="38" fill="#111827"/>
    <rect x="115" y="340" width="130" height="210" rx="48" fill="#111827"/>
  </g>

  <!-- Accent -->
  <path d="M700 680H920" stroke="#F59E0B" stroke-opacity="0.33" stroke-width="14" stroke-linecap="round"/>
</svg>
